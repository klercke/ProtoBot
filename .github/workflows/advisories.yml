name: Advisories

on:
  pull_request:
    paths:
      - Cargo.lock
      - deny.toml
  push:
    branches: [main]
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions: {}

jobs:
  advisories:
    name: cargo-deny advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@382a9ed9481c7c1f94f68b72ef105b3417c73877 # v32.1.0
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: protobot
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Check advisories
        run: nix develop --command cargo deny check advisories
