name: Image

on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

permissions: {}

concurrency:
  group: image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    name: Build and push image
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: cachix/install-nix-action@bb0495a1086c46893eee56f32fd192dfe4a15bb9 # v32.0.0
        with:
          extra_nix_config: |
            access-tokens = github.com=${{ github.token }}

      - uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: protobot
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build image
        run: nix build .#image

      - name: Push image
        env:
          REGISTRY_USER: ${{ github.actor }}
          REGISTRY_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          image=ghcr.io/klercke/protobot
          skopeo() { nix run --inputs-from . nixpkgs#skopeo -- "$@"; }

          tags=("sha-${GITHUB_SHA::12}")
          if [ "$EVENT" = "release" ]; then
            version=${RELEASE_TAG#v}
            tags+=("$version" "${version%.*}" latest)
          else
            tags+=(main)
          fi

          skopeo login ghcr.io --username "$REGISTRY_USER" --password-stdin <<< "$REGISTRY_TOKEN"
          for tag in "${tags[@]}"; do
            skopeo copy "docker-archive:result" "docker://$image:$tag"
          done

      - name: Add image to release notes
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          version=${RELEASE_TAG#v}
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          # shellcheck disable=SC2016
          printf '\n### Container image\n\n```\ndocker pull ghcr.io/klercke/protobot:%s\n```\n' "$version" >> notes.md
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

  deploy:
    name: Deploy to ${{ github.event_name == 'release' && 'production' || 'preview' }}
    needs: image
    runs-on: ubuntu-latest
    environment: ${{ github.event_name == 'release' && 'production' || 'preview' }}
    concurrency:
      group: deploy-${{ github.event_name == 'release' && 'production' || 'preview' }}
      cancel-in-progress: false
    permissions: {}
    steps:
      - name: Join NetBird
        env:
          NETBIRD_SETUP_KEY: ${{ secrets.NETBIRD_SETUP_KEY }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
        run: |
          curl -fsSL https://pkgs.netbird.io/debian/public.key \
            | sudo gpg --dearmor -o /usr/share/keyrings/netbird-archive-keyring.gpg
          echo 'deb [signed-by=/usr/share/keyrings/netbird-archive-keyring.gpg] https://pkgs.netbird.io/debian stable main' \
            | sudo tee /etc/apt/sources.list.d/netbird.list
          sudo apt-get update
          sudo apt-get install -y netbird

          for _ in $(seq 30); do
            sudo test -S /var/run/netbird/sock && break
            sleep 1
          done
          if ! sudo test -S /var/run/netbird/sock; then
            echo "::error::NetBird daemon did not open its socket"
            sudo journalctl -u netbird --no-pager -n 100 || true
            exit 1
          fi

          sudo netbird up --setup-key "$NETBIRD_SETUP_KEY" --hostname "gha-$GITHUB_RUN_ID"
          for _ in $(seq 30); do
            getent hosts "$DEPLOY_HOST" && exit 0
            sleep 2
          done
          echo "::error::$DEPLOY_HOST did not resolve over NetBird"
          sudo netbird status --detail
          exit 1

      - name: Deploy
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          KNOWN_HOSTS: ${{ vars.PROTOBOT01_KNOWN_HOSTS }}
          DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
          EVENT: ${{ github.event_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [ "$EVENT" = "release" ]; then
            tag=${RELEASE_TAG#v}
          else
            tag="sha-${GITHUB_SHA::12}"
          fi

          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy
          chmod 600 ~/.ssh/deploy
          printf '%s\n' "$KNOWN_HOSTS" > ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy \
            -o IdentitiesOnly=yes \
            -o BatchMode=yes \
            -o StrictHostKeyChecking=yes \
            "protobot@$DEPLOY_HOST" "$tag"

      - name: Leave NetBird
        if: always()
        run: sudo netbird down || true
