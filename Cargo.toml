[package]
name = "protobot"
version = "0.10.0"
edition = "2021"
publish = false

[dependencies]
chrono = "0.4.42"
chrono-tz = "0.10.4"
dotenvy = "0.15.7"
poise = { version = "0.6" }
rand = { version = "0.8.5", features = ["small_rng"] }
regex = "1.10.2"
rusqlite = { version = "0.43.0", features = ["bundled", "fallible_uint"] }
tokio = { version = "1.21.2", features = ["macros", "rt-multi-thread", "full"] }
tracing = "0.1.40"
tracing-appender = "0.2.3"
tracing-subscriber = { version = "0.3.18", features = ["json"] }

[features]
default = ["color-logging"]
color-logging = []

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
enum_glob_use = "deny"
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "warn"
significant_drop_tightening = "allow"
